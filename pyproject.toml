[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "passlocker"
version = "1.0.3"
description = "Password Encryption"
authors = [
    { name = "Chris Lee", email = "github@chrislee.dhs.org" }
]
readme = "README.md"
requires-python = ">=3.12"
license = { text = "CC-BY-NC-SA-4.0" }
keywords = ["encryption", "passwords", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3 :: Only"
]
dependencies = [
    "pycryptodome >= 3.23.0",
    "pyperclip >= 1.11.0",
    "pwinput >= 1.0.3",
    "argon2-cffi >= 25.1.0",
    "requests >= 2.32.5",
    "qrcode >= 8.2",
    "colorama >= 0.4.6"
]

[license]
license = "CC-BY-NC-SA-4.0"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/chrislee35/passlocker"

[tool.setuptools]
packages = { find = {} }

[project.scripts]
passlocker = "passlocker.cui:main"

[project.optional-dependencies]
dev = [
    "build",
    "twine",
    "black",
    "ruff"
]

